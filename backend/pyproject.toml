[project]
name = "kora"
version = "0.2.0"
description = "Africa-first academic aggregator: everything by and about a scholar or author"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "rapidfuzz>=3.0",
    "rich>=13.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["aiosqlite>=0.20", "pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
kora = "kora.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real external APIs (deselect with -m 'not live')"]
